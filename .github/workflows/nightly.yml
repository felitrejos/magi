name: Nightly

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  versions:
    name: Find the newest Claude Code and Codex
    runs-on: ubuntu-latest
    outputs:
      claude: ${{ steps.find.outputs.claude }}
      codex: ${{ steps.find.outputs.codex }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "claude=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/latest)" >> "$GITHUB_OUTPUT"
          tag=$(gh api repos/openai/codex/releases/latest --jq .tag_name)
          echo "codex=${tag#rust-v}" >> "$GITHUB_OUTPUT"

  contract:
    name: Contract tests on ${{ matrix.os }}
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLAUDE_VERSION: ${{ needs.versions.outputs.claude }}
      CODEX_VERSION: ${{ needs.versions.outputs.codex }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: remote/go.mod
          cache-dependency-path: remote/go.sum
      - name: Install tmux, Claude Code and Codex
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get install -y tmux; fi
          ci/install.sh claude "$CLAUDE_VERSION" "$HOME/.local/bin"
          ci/install.sh codex "$CODEX_VERSION" "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Log in to Claude Code and Codex
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p ~/.claude ~/.codex
          jq -n --arg t "$CLAUDE_CODE_OAUTH_TOKEN" '{env: {CLAUDE_CODE_OAUTH_TOKEN: $t, DISABLE_AUTOUPDATER: "1"}}' > ~/.claude/settings.json
          echo 'cli_auth_credentials_store = "file"' > ~/.codex/config.toml
          printenv OPENAI_API_KEY | ~/.local/bin/codex login --with-api-key
      - name: Run the contract tests
        working-directory: remote
        run: |
          go test -count=1 -tags contract -run '^TestContract(Claude|Codex)' -v ./... | tee "$RUNNER_TEMP/contract.log"
          ! grep -q -- '--- SKIP' "$RUNNER_TEMP/contract.log"

  round-trip:
    needs: versions
    uses: ./.github/workflows/round-trip.yml
    with:
      claude-version: ${{ needs.versions.outputs.claude }}
    secrets: inherit

  raise:
    name: Raise the tested versions
    needs: [versions, contract, round-trip]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Commit the new versions to main
        env:
          CLAUDE_VERSION: ${{ needs.versions.outputs.claude }}
          CODEX_VERSION: ${{ needs.versions.outputs.codex }}
        run: |
          jq --arg c "$CLAUDE_VERSION" --arg x "$CODEX_VERSION" 'def newest($v): [., $v] | max_by(split(".") | map(tonumber)); .claude.max |= newest($c) | .codex.max |= newest($x)' remote/tested.json > "$RUNNER_TEMP/tested.json"
          mv "$RUNNER_TEMP/tested.json" remote/tested.json
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Nightly: contract tests pass with claude $CLAUDE_VERSION, codex $CODEX_VERSION" remote/tested.json
          git push -q origin HEAD:main

  report:
    name: Open or update the issue for this failure
    needs: [versions, contract, round-trip, raise]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLAUDE_VERSION: ${{ needs.versions.outputs.claude }}
          CODEX_VERSION: ${{ needs.versions.outputs.codex }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly fails with Claude Code $CLAUDE_VERSION and Codex $CODEX_VERSION"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "It failed again: $RUN"
          else
            gh issue create --title "$title" --body "The contract tests or the Linux to Linux round trip failed: $RUN

          remote/tested.json keeps its old max until a nightly passes. If this version can't be made to work, add it to broken in remote/tested.json by hand."
          fi
