name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: remote/go.sum
      - name: Build and package
        working-directory: remote
        env:
          CGO_ENABLED: "0"
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for t in aarch64-apple-darwin:darwin:arm64 x86_64-apple-darwin:darwin:amd64 x86_64-unknown-linux-musl:linux:amd64 aarch64-unknown-linux-musl:linux:arm64; do
            target=${t%%:*} rest=${t#*:}
            out="$GITHUB_WORKSPACE/build/$target"
            mkdir -p "$out"
            GOOS=${rest%%:*} GOARCH=${rest#*:} go build -trimpath -ldflags "-s -w -X main.version=${TAG#v}" -o "$out/magi" .
            tar -czf "$GITHUB_WORKSPACE/dist/magi-$target.tar.gz" -C "$out" magi -C "$GITHUB_WORKSPACE" LICENSE README.md
            (cd "$GITHUB_WORKSPACE/dist" && shasum -a 256 "magi-$target.tar.gz" > "magi-$target.tar.gz.sha256")
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "magi $TAG" dist/* install.sh
