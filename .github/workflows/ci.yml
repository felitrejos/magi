name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: magi on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: remote/go.mod
          cache-dependency-path: remote/go.sum
      - run: if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get install -y tmux fish tcsh git-lfs; fi
      - if: runner.os == 'Linux'
        run: shellcheck --severity=style scripts/*.sh internal/*/scripts/*.sh ../ci/*.sh ../plugin/bin/magi
      - run: go vet ./... && go vet -tags contract ./...
      - if: runner.os == 'Linux'
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags contract ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -count=1 ./...

  mac:
    name: menu bar app
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate
      - run: xcodebuild -project magi.xcodeproj -scheme magi -derivedDataPath build -destination platform=macOS test

  core-busybox:
    name: magi on BusyBox
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache git git-lfs tmux go curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: adduser -D runner-user && chown -R runner-user .
      - run: su runner-user -c "cd remote && GOFLAGS=-buildvcs=false GOTOOLCHAIN=auto go test -count=1 ./..."
