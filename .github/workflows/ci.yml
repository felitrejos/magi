name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: magi on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: remote/go.sum
      - run: if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get install -y tmux fish tcsh git-lfs; fi
      - if: runner.os == 'Linux'
        run: shellcheck --severity=style scripts/*.sh ../ci/*.sh
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -count=1 ./...

  core-busybox:
    name: magi on BusyBox
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache git git-lfs tmux go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: adduser -D runner-user && chown -R runner-user .
      - run: su runner-user -c "cd remote && GOFLAGS=-buildvcs=false GOTOOLCHAIN=auto go test -count=1 ./..."
