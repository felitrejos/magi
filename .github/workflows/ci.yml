name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get install -y tmux fish tcsh git-lfs; fi
      - if: runner.os == 'Linux'
        run: shellcheck --severity=style scripts/*.sh
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -count=1 ./...

  busybox:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache git git-lfs tmux go
      - uses: actions/checkout@v4
      - run: adduser -D runner-user && chown -R runner-user .
      - run: su runner-user -c "GOFLAGS=-buildvcs=false GOTOOLCHAIN=auto go test -count=1 ./..."
