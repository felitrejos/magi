[package]
name = "magi-monitor"
description = "Live monitoring for your Rex hosts and the AI agents running on them"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "magi"
path = "src/main.rs"

[dependencies]
lexopt = "0.3.2"
libc = "0.2.191"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
unicode-segmentation = "1.12"
unicode-width = "0.2.3"
vt100 = "0.18.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
flate2 = "1.1.11"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
mddog = { git = "https://github.com/qu8n/mddog", rev = "67fdc01354cae8fbb83c0981f22d702fb716c83a" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSColor", "NSGraphics", "NSFontDescriptor", "objc2-core-foundation"] }
io-kit-sys = "0.5.0"
mach2 = "0.7.0"
