[package]
name = "magi-monitor"
description = "Live monitoring for your Rex hosts and the AI agents running on them"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "magi"
path = "src/main.rs"

[dependencies]
lexopt = "0.3.2"
libc = "0.2.191"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
flate2 = "1.1.11"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
io-kit-sys = "0.5.0"
mach2 = "0.7.0"
